<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biomechanics Model Lab — Test Runner</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background-color: #090d16;
      color: #e2e8f0;
      margin: 0;
      padding: 30px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      margin-top: 0;
      font-size: 22px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .summary {
      display: flex;
      gap: 20px;
      padding: 16px;
      background: #0f172a;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .summary-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .passed { color: #10b981; }
    .failed { color: #ef4444; }
    .test-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .test-item {
      padding: 12px 16px;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: monospace;
      font-size: 14px;
    }
    .test-item:last-child {
      border-bottom: none;
    }
    .test-status {
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
    }
    .status-pass {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid #10b981;
    }
    .status-fail {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid #ef4444;
    }
    .back-btn {
      display: inline-block;
      margin-top: 20px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
    }
    .back-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Biomechanics Model Lab — Unit Test Suite</h1>
    <div class="summary" id="summary">
      <div class="summary-item">Toplam: <span id="total-count">0</span></div>
      <div class="summary-item passed">Başarılı: <span id="passed-count">0</span></div>
      <div class="summary-item failed">Hatalı: <span id="failed-count">0</span></div>
    </div>
    <ul class="test-list" id="test-list"></ul>
    <a href="../index.html" class="back-btn">← Laboratuvara Geri Dön</a>
  </div>

  <script type="module">
    import { runAllTests } from './unit-tests.js';

    const results = runAllTests();
    const listEl = document.getElementById('test-list');
    let passed = 0;
    let failed = 0;

    results.forEach(res => {
      if (res.passed) passed++;
      else failed++;

      const li = document.createElement('li');
      li.className = 'test-item';
      li.innerHTML = `
        <span>${res.name}</span>
        <span class="test-status ${res.passed ? 'status-pass' : 'status-fail'}">
          ${res.passed ? 'PASS' : 'FAIL'}
        </span>
      `;
      if (!res.passed) {
        const errDiv = document.createElement('div');
        errDiv.style.color = '#ef4444';
        errDiv.style.fontSize = '12px';
        errDiv.textContent = res.error;
        li.appendChild(errDiv);
      }
      listEl.appendChild(li);
    });

    document.getElementById('total-count').textContent = results.length;
    document.getElementById('passed-count').textContent = passed;
    document.getElementById('failed-count').textContent = failed;
  </script>
</body>
</html>
